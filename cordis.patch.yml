# dsh-auto-continue 随包默认配置层：
# 包声明 dsh.bundle.patch 指向本文件，安装时作为该组合包的 patch 层加载，
# 用 insert 把插件条目（含默认配置）注入 profile。
# 用户如需覆盖个别字段，在 profile 的 cordis.patch.yml 里加同 id 条目即可（按层合并）。
- insert:
    - id: auto-continue
      name: dsh-auto-continue
      config:
        enabled: true
        autoContinue: true
        continueText: 继续
        # 每会话继续上限：重试与切换都计入。默认 100 次，按 1~1.5 分钟间隔约可连续尝试 2 小时
        continueMax: 100
        continueDelayMs: 1500
        autoSwitchModel: true
        useAllConfiguredModels: true
        excludeProviders:
          - deepseek-official
        # 同一模型连续重试次数，额度用完才切下一个兜底（0 = 失败立刻切换）
        retriesPerModel: 1
        # 熔断开关（默认关闭）：不同模型连续报同一错误达到该次数才停止本轮。
        # 按"换到能用为止、中途不停止"的需求保持 0
        identicalFailuresLimit: 0
        # 失败重试的随机退避区间（毫秒）：实际等待在 [min, max] 均匀随机。
        # 开发阶段 10~15 秒快速迭代；上线想拉长改回 60000/90000（1~1.5 分钟）
        retryBackoffMinMs: 10000
        retryBackoffMaxMs: 15000
        # 失败模型冷却时长（默认 5 小时）：冷却期内每次切换都跳过它，
        # 记录持久化在 ~/.dsh/auto-continue/model-fails.json，重启 dsh 不丢
        modelCooldownMs: 18000000
        maxTokensContinue: true
        verbose: false
        fallbacks:
          - provider: fengwind
            model: deepseek-v4.1-flash
          - provider: fengwind
            model: kimi-k3
          - provider: fengwind
            model: mimo-v2.6-flash
          - provider: fengwind
            model: gemini-3.8-flash
          - provider: fengwind
            model: muse-spark-1.3-contributor
          - provider: fengwind
            model: space-bunny-alpha
